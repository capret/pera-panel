<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title data-i18n>Sign in · Pera Panel</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='language.css') }}"><script id="i18n-catalog" type="application/json">{{ translations|tojson }}</script><script defer src="{{ url_for('static', filename='i18n.js') }}"></script><script defer src="{{ url_for('static', filename='login.js') }}"></script></head>
<body class="login-page"><main class="login-card"><label class="language-switch"><span data-i18n>Language</span><select data-language aria-label="Language" data-i18n-aria-label><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><div class="brand"><span class="brand-mark">p</span><span>pera<span class="brand-sub"> / panel</span></span></div><div data-i18n class="eyebrow">DON’T STARVE TOGETHER</div><h1 data-i18n>Welcome back,<br>world keeper.</h1><p data-i18n class="muted">A little control for a wild world.</p><form id="login-form"><label data-i18n>Username<input name="username" autocomplete="username" required value="admin"></label><label data-i18n>Password<input name="password" type="password" autocomplete="current-password" required></label><div id="login-error" class="error" role="alert"></div><button data-i18n class="button primary" type="submit">Enter your camp <span>→</span></button></form><footer>Pera Panel {{ version }} · <span data-i18n>Your server, your rules.</span></footer></main><div class="login-landscape" aria-hidden="true"><div class="sun"></div><div class="hill hill-back"></div><div class="hill"></div><div class="tree tree-one"></div><div class="tree tree-two"></div><div data-i18n class="landscape-caption">Make a place<br>worth surviving.</div><span data-i18n class="landscape-coordinates">THE CONSTANT / EST. DAY 01</span></div></body></html>
